# Publishes a GitHub release when a version tag (for example v1.0.0) is pushed.
# Every check runs first; the release is created only if they all pass. The VSIX is
# attached, and the notes are that version's section of CHANGELOG.md. The same file then goes
# to Open VSX when the OVSX_TOKEN secret exists.

name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
    - name: Tag matches package.json version
      run: |
        VERSION=$(node -p "require('./package.json').version")
        test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1; }
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
    - run: npm ci
    - run: npm run lint
    - run: npm run test:unit
    - name: Integration tests (VS Code in a virtual screen)
      run: xvfb-run -a npm run test:integration
    - name: Build the VSIX
      run: npx vsce package --out "vibecode-explorer-$VERSION.vsix"
    - name: Release notes from CHANGELOG.md
      run: |
        awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
        test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" "vibecode-explorer-$VERSION.vsix" --title "VibeCode Explorer $VERSION" --notes-file notes.md
    # Open VSX (Cursor, Windsurf, VSCodium): only when the owner has added the OVSX_TOKEN secret.
    # Uses the registry's own upload API, so no extra tool is installed.
    - name: Publish to Open VSX
      env:
        OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      run: |
        if [ -z "$OVSX_TOKEN" ]; then echo "No OVSX_TOKEN secret: skipping Open VSX."; exit 0; fi
        API=https://open-vsx.org/api
        if [ "$(curl -s -o /dev/null -w '%{http_code}' "$API/mimnets")" = "404" ]; then
          curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d '{"name":"mimnets"}' "$API/-/namespace/create?token=$OVSX_TOKEN"
        fi
        curl -sS --fail-with-body -X POST -H "Content-Type: application/octet-stream" --data-binary "@vibecode-explorer-$VERSION.vsix" "$API/-/publish?token=$OVSX_TOKEN"
