# Checks every push and pull request: lint, unit tests, the VS Code integration suite
# (inside a virtual screen, since the runner has none) and that the VSIX still builds.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 22 or later: `node --test` expands the test file pattern itself.
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run test:unit
    - name: Integration tests (VS Code in a virtual screen)
      run: xvfb-run -a npm run test:integration
    - run: npm run package
